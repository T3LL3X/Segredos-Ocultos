<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha RPG Profissional</title>

<style>
:root{
    --bg:#0f1115;
    --card:#1a1f27;
    --accent:#00ff9c;
    --text:#e6e6e6;
    --muted:#888;
}

body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    text-align:center;
    padding:20px;
    font-size:28px;
    letter-spacing:2px;
}

.container{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:15px;
    box-shadow:0 0 15px rgba(0,255,156,0.05);
}

.card h2{
    margin-top:0;
    font-size:18px;
    color:var(--accent);
}

label{
    font-size:12px;
    color:var(--muted);
}

input, textarea{
    width:100%;
    background:#0c0f13;
    border:none;
    color:var(--accent);
    padding:6px;
    border-radius:6px;
    margin-bottom:8px;
}

.grid-attrs{
    display:grid;
    grid-template-columns: repeat(5,1fr);
    gap:10px;
}

.attr-box{
    text-align:center;
}

.skills{
    columns:2;
}

button{
    width:100%;
    padding:10px;
    background:var(--accent);
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    color:var(--muted);
}

</style>
</head>

<body>

<header>FICHA RPG</header>

<div class="container">

<div class="card">
<h2>Informações</h2>
<label>Nome</label><input id="nome">
<label>Origem</label><input id="origem">
<label>Classe</label><input id="classe">
</div>

<div class="card">
<h2>Status</h2>
<label>PV</label><input id="pv">
<label>Sanidade</label><input id="san">
<label>DEF</label><input id="def">
<label>Movimento</label><input id="mov">
</div>

<div class="card">
<h2>Atributos</h2>
<div class="grid-attrs">
<div class="attr-box">FOR<input id="for"></div>
<div class="attr-box">DEX<input id="dex"></div>
<div class="attr-box">CON<input id="con"></div>
<div class="attr-box">INT<input id="int"></div>
<div class="attr-box">CAR<input id="car"></div>
</div>
</div>

<div class="card">
<h2>Perícias</h2>
<div class="skills">
<label>Atletismo</label><input id="atletismo">
<label>Medicina</label><input id="medicina">
<label>Sobrevivência</label><input id="sobrevivencia">
<label>Vontade</label><input id="vontade">
<label>Luta</label><input id="luta">
<label>Reflexos</label><input id="reflexos">
<label>Investigação</label><input id="investigacao">
<label>Percepção</label><input id="percepcao">
</div>
</div>

<div class="card">
<h2>Equipamentos</h2>
<textarea id="equipamentos" rows="6"></textarea>
</div>

<div class="card">
<h2>Habilidades</h2>
<textarea id="habilidades" rows="6"></textarea>
</div>

<div class="card">
<h2>Ações</h2>
<button onclick="salvar()">Salvar</button>
<button onclick="carregar()">Carregar</button>
<button onclick="limpar()">Limpar</button>
</div>

</div>

<div class="footer">Ficha salva automaticamente no navegador</div>

<script>
const campos = document.querySelectorAll('input, textarea');

function salvar(){
    campos.forEach(c => localStorage.setItem(c.id, c.value));
}

function carregar(){
    campos.forEach(c => c.value = localStorage.getItem(c.id) || '');
}

function limpar(){
    campos.forEach(c => {
        c.value = '';
        localStorage.removeItem(c.id);
    });
}

window.onload = carregar;
</script>

</body>
</html>
