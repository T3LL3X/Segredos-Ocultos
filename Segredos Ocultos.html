<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segredos ocultos</title>

<style>
:root{
    --fundo:#000000;
    --caixa:#000000;
    --texto1:#920b0b;
    --texto2:#ffffff;
    --nome:#f5ecec;
    --principal:#df0000;
}

body{
    margin:0;
    font-family: Segoe UI, Trebuchet MS, sans-serif;
    background:var(--fundo);
    color:var(--texto1);
}

header{
    background: url(logo.png) no-repeat center;
    background-size: 200px;
    height: 90px;
    background-color:#000;
}

.container{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:var(--caixa);
    border-radius:16px;
    padding:15px;
    box-shadow:0 0 20px rgba(255,0,0,0.1);
}

h2{
    margin-top:0;
    color:var(--texto1);
}

label{
    font-size:12px;
    color:var(--nome);
}

input, textarea{
    width:100%;
    background:#0c0f13;
    border:1px solid #000;
    color:var(--texto2);
    padding:6px;
    border-radius:6px;
    margin-bottom:8px;
}

input:focus, textarea:focus{
    outline:none;
    border:1px solid red;
    box-shadow:0 0 5px red;
}

.grid-attrs{
    display:grid;
    grid-template-columns: repeat(5,1fr);
    gap:8px;
}

.attr-box{
    text-align:center;
}

.skills{
    columns:2;
}

/* STATUS INTERATIVO */
.status-box{
    margin-bottom:10px;
}

.status-box input{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.status-buttons{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:5px;
}

.status-buttons button{
    padding:6px;
    font-size:12px;
    border-radius:10px;
}

/* BOTÕES INSANOS */
button{
    width:100%;
    padding:12px;
    background: radial-gradient(circle at 30% 30%, #ff1a1a, #920b0b);
    border:1px solid #ff4d4d;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    letter-spacing:1px;
    position:relative;
    overflow:hidden;

    box-shadow:
        0 0 10px rgba(255,0,0,0.4),
        inset 0 0 10px rgba(0,0,0,0.8);

    transition: all 0.2s ease;
}

button::before{
    content:'';
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background: radial-gradient(circle, rgba(255,0,0,0.3), transparent 70%);
    opacity:0;
    transition: opacity 0.3s;
}

button:hover{
    transform: translateY(-2px) scale(1.03);
    box-shadow:
        0 0 20px rgba(255,0,0,0.7),
        0 0 40px rgba(255,0,0,0.3),
        inset 0 0 15px rgba(0,0,0,0.9);
}

button:hover::before{
    opacity:1;
}

button:active{
    transform: scale(0.97);
    box-shadow:
        0 0 5px rgba(255,0,0,0.5),
        inset 0 0 20px rgba(0,0,0,1);
}

/* RIPPLE */
.ripple{
    position:absolute;
    width:10px;
    height:10px;
    background: rgba(255,255,255,0.6);
    border-radius:50%;
    transform: scale(0);
    animation: rippleEffect 0.6s linear;
    pointer-events:none;
}

@keyframes rippleEffect{
    to{
        transform: scale(15);
        opacity:0;
    }
}

.footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    color:var(--principal);
}

.status-box{
    margin-bottom:12px;
}

.status-buttons{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:5px;
}

.status-buttons button{
    padding:6px;
    border-radius:10px;
    font-size:12px;
}

/* BARRAS */
.bar-container{
    position:relative;
    width:100%;
    height:22px;
    background:#1a1a1a;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:5px;
    box-shadow: inset 0 0 6px #000;
}

.bar-fill{
    height:100%;
    width:100%;
    transition: width 0.3s ease;
}

/* CORES */
.bar-fill.pv{
    background: linear-gradient(90deg, #ff1a1a, #ff4d4d);
}

.bar-fill.pe{
    background: linear-gradient(90deg, #1a75ff, #4da6ff);
}

.bar-fill.san{
    background: linear-gradient(90deg, #9933ff, #cc66ff);
}

.bar-text{
    position:absolute;
    width:100%;
    text-align:center;
    top:0;
    left:0;
    font-size:13px;
    font-weight:bold;
    line-height:22px;
    color:white;
    text-shadow:0 0 4px black;
}
.estado{
    margin-left:8px;
    font-size:12px;
    font-weight:bold;
    padding:2px 6px;
    border-radius:8px;
}

/* cores por estado */
.estado.estavel{
    background:#2ecc71;
    color:#000;
}

.estado.ferido{
    background:#f1c40f;
    color:#000;
}

.estado.grave{
    background:#e67e22;
    color:#000;
}

.estado.morrendo{
    background:#e74c3c;
    color:#fff;
}
</style>
</head>

<body>

<header></header>

<div class="container">

<div class="card">
<h2>Informações</h2>
<label>Nome</label><input id="nome">
<label>Origem</label><input id="origem">
<label>Classe</label><input id="classe">
</div>

<div class="card">
<h2>Status</h2>

<label>Afinidade</label><input id="afi">

<div class="status-box">
  <label>PV <span id="pv-estado" class="estado"></span></label>
  <div class="bar-container">
    <div id="pv-bar" class="bar-fill pv"></div>
    <span id="pv-text" class="bar-text">100</span>
  </div>
  <input id="pv" type="number" value="100" hidden>

  <div class="status-buttons">
    <button onclick="alterar('pv', -5)">-5</button>
    <button onclick="alterar('pv', -1)">-1</button>
    <button onclick="alterar('pv', 1)">+1</button>
    <button onclick="alterar('pv', 5)">+5</button>
  </div>
</div>

<div class="status-box">
  <label>PE <span id="pe-estado" class="estado"></span></label>
  <div class="bar-container">
    <div id="pe-bar" class="bar-fill pe"></div>
    <span id="pe-text" class="bar-text">50</span>
  </div>
  <input id="pe" type="number" value="50" hidden>

  <div class="status-buttons">
    <button onclick="alterar('pe', -5)">-5</button>
    <button onclick="alterar('pe', -1)">-1</button>
    <button onclick="alterar('pe', 1)">+1</button>
    <button onclick="alterar('pe', 5)">+5</button>
  </div>
</div>

<div class="status-box">
  <label>Sanidade <span id="san-estado" class="estado"></span></label>
  <div class="bar-container">
    <div id="san-bar" class="bar-fill san"></div>
    <span id="san-text" class="bar-text">100</span>
  </div>
  <input id="san" type="number" value="100" hidden>

  <div class="status-buttons">
    <button onclick="alterar('san', -5)">-5</button>
    <button onclick="alterar('san', -1)">-1</button>
    <button onclick="alterar('san', 1)">+1</button>
    <button onclick="alterar('san', 5)">+5</button>
  </div>
</div>

<label>Defesa</label><input id="def">
<label>Movimento</label><input id="mov">

</div>

<div class="card">
<h2>Atributos</h2>
<div class="grid-attrs">
<div class="attr-box"><label>FOR</label><input id="for"></div>
<div class="attr-box"><label>DEX</label><input id="dex"></div>
<div class="attr-box"><label>CON</label><input id="con"></div>
<div class="attr-box"><label>INT</label><input id="int"></div>
<div class="attr-box"><label>CAR</label><input id="car"></div>
</div>
</div>

<div class="card">
<h2>Perícias</h2>
<div class="skills">
<label>Arcanismo</label><input id="arcanismo">
<label>Artes</label><input id="artes">
<label>Atletismo</label><input id="atletismo">
<label>Ciência</label><input id="ciencia">
<label>Crimes</label><input id="crimes">
<label>Diplomacia</label><input id="diplomacia">
<label>Enganação</label><input id="enganacao">
<label>Fortitude</label><input id="fortitude">
<label>Furtividade</label><input id="furtividade">
<label>História</label><input id="historia">
<label>Iniciativa</label><input id="iniciativa">
<label>Intimidação</label><input id="intimidacao">
<label>Intuição</label><input id="intuicao">
<label>Investigação</label><input id="investigacao">
<label>Luta</label><input id="luta">
<label>Medicina</label><input id="medicina">
<label>Percepção</label><input id="percepcao">
<label>Pilotagem</label><input id="pilotagem">
<label>Planejamento</label><input id="planejamento">
<label>Pontaria</label><input id="pontaria">
<label>Reflexos</label><input id="reflexos">
<label>Religião</label><input id="religiao">
<label>Sobrevivência</label><input id="sobrevivencia">
<label>Tecnologia</label><input id="tecnologia">
<label>Vontade</label><input id="vontade">
</div>
</div>

<div class="card">
<h2>Equipamentos</h2>
<textarea id="equipamentos" rows="6"></textarea>
</div>

<div class="card">
<h2>Habilidades</h2>
<textarea id="habilidades" rows="6"></textarea>
</div>

<div class="card">
<h2>Ações</h2>
<button onclick="salvar()">Salvar</button>
<button onclick="carregar()">Carregar</button>
<button onclick="limpar()">Limpar</button>
</div>

</div>

<div class="footer">V1 da ficha por Gleibson e Vini</div>

<script>
const PER=['Arcanismo','Artes','Atletismo','Ciências','Crime','Diplomacia','Enganação','Fortitude','Furtividade','História','Iniciativa','Intimidação','Intuição','Investigação','Luta','Medicina','Percepção','Pilotagem','Planejamento','Pontaria','Reflexos','Religião','Sobrevivência','Tecnologia','Vontade'];
const ATR=['Força','Destreza','Constituição','Inteligência','Carisma'];
let idx=null;
const load=()=>JSON.parse(localStorage.getItem('so_v3')||'[]');
const save=d=>localStorage.setItem('so_v3',JSON.stringify(d));

function novo(){
 const nome=prompt('Nome'); if(!nome)return;
 const senha=prompt('Senha')||'';
 let a={}; ATR.forEach(x=>a[x]=1);
 let p={}; PER.forEach(x=>p[x]=0);
 let ch={nome,senha,classe:'',subclasse:'',afinidade:0,atributos:a,pericias:p,pvAtual:12,peAtual:9,sanAtual:8,inventario:'',diario:''};
 let d=load(); d.push(ch); save(d); render();
}
function render(){
 slots.innerHTML='';
 load().forEach((c,i)=>{
 let div=document.createElement('div');
 div.className='slot';
 div.innerHTML=`${c.nome} <button>Abrir</button>`;
 div.querySelector('button').onclick=()=>abrir(i);
 slots.appendChild(div);
 });
}
function abrir(i){
 let d=load(); if(prompt('Senha')!==d[i].senha)return alert('Senha incorreta');
 idx=i; landing.classList.add('hidden'); ficha.classList.remove('hidden'); preencher();
}
function preencher(){
 let c=load()[idx];
 tituloFicha.textContent=c.nome;
 nome.value=c.nome; classe.value=c.classe; subclasse.value=c.subclasse;
 afinidade.value=c.afinidade; afinTxt.textContent=c.afinidade+'%';
 atributos.innerHTML='';
 Object.keys(c.atributos).forEach(k=>{
  let e=document.createElement('div');
  e.innerHTML=`${k}: <input type='number' value='${c.atributos[k]}' data-a='${k}'>`;
  atributos.appendChild(e);
 });
 pericias.innerHTML='';
 PER.forEach(k=>{
  let e=document.createElement('div');
  e.innerHTML=`${k}: <input type='number' value='${c.pericias[k]}' data-p='${k}'>`;
  pericias.appendChild(e);
 });
 inventario.value=c.inventario; diario.value=c.diario;
 recalcular();
}
function recalcular(){
 let con=+document.querySelector("[data-a='Constituição']").value||1;
 let dex=+document.querySelector("[data-a='Destreza']").value||1;
 let intel=+document.querySelector("[data-a='Inteligência']").value||1;
 let car=+document.querySelector("[data-a='Carisma']").value||1;
 let fort=+document.querySelector("[data-p='Fortitude']").value||0;
 pvMax.textContent=10+(con*2)+fort;
 peMax.textContent=7+dex+intel;
 sanMax.textContent=5+(intel*2)+car;
 def.textContent=10+con;
 let a=+afinidade.value; afinTxt.textContent=a+'%';
 let est='Desconectado';
 if(a>=5)est='Contato'; if(a>=20)est='Sensível'; if(a>=35)est='Canalização';
 if(a>=50)est='Manifestação'; if(a>=65)est='Sintonização';
 if(a>=80)est='Ressonância'; if(a>=100)est='Transgressão'; if(a>=110)est='Compreensão';
 estagio.textContent=est;
}
novo.onclick=novo;
voltar.onclick=()=>{ficha.classList.add('hidden');landing.classList.remove('hidden');render();};
salvar.onclick=()=>{
 let d=load(), c=d[idx];
 c.nome=nome.value;c.classe=classe.value;c.subclasse=subclasse.value;c.afinidade=+afinidade.value;
 c.pvAtual=+pvAtual.value||0;c.peAtual=+peAtual.value||0;c.sanAtual=+sanAtual.value||0;
 c.inventario=inventario.value;c.diario=diario.value;
 document.querySelectorAll('[data-a]').forEach(x=>c.atributos[x.dataset.a]=+x.value);
 document.querySelectorAll('[data-p]').forEach(x=>c.pericias[x.dataset.p]=+x.value);
 save(d); alert('Salvo');
};
document.addEventListener('input',e=>{if(ficha.classList.contains('hidden'))return;recalcular();});
render();
</script>

</body>
</html>
