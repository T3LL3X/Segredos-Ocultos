<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segredos ocultos</title>

<style>
:root{
    --fundo:#000000;
    --caixa:#000000;
    --texto1:#920b0b;
    --texto2:#ffffff;
    --nome:#f5ecec;
    --principal:#df0000;
}

body{
    margin:0;
    font-family: Segoe UI, Trebuchet MS, sans-serif;
    background:var(--fundo);
    color:var(--texto1);
}

header{
    background: url(logo.png) no-repeat center;
    background-size: 200px;
    height: 90px;
    background-color:#000;
}

.container{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:var(--caixa);
    border-radius:16px;
    padding:15px;
    box-shadow:0 0 20px rgba(255,0,0,0.1);
}

h2{
    margin-top:0;
    color:var(--texto1);
}

label{
    font-size:12px;
    color:var(--nome);
}

input, textarea{
    width:100%;
    background:#0c0f13;
    border:1px solid #000;
    color:var(--texto2);
    padding:6px;
    border-radius:6px;
    margin-bottom:8px;
}

input:focus, textarea:focus{
    outline:none;
    border:1px solid red;
    box-shadow:0 0 5px red;
}

.grid-attrs{
    display:grid;
    grid-template-columns: repeat(5,1fr);
    gap:8px;
}

.attr-box{
    text-align:center;
}

.skills{
    columns:2;
}

/* STATUS INTERATIVO */
.status-box{
    margin-bottom:10px;
}

.status-box input{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.status-buttons{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:5px;
}

.status-buttons button{
    padding:6px;
    font-size:12px;
    border-radius:10px;
}

/* BOTÕES INSANOS */
button{
    width:100%;
    padding:12px;
    background: radial-gradient(circle at 30% 30%, #ff1a1a, #920b0b);
    border:1px solid #ff4d4d;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    letter-spacing:1px;
    position:relative;
    overflow:hidden;

    box-shadow:
        0 0 10px rgba(255,0,0,0.4),
        inset 0 0 10px rgba(0,0,0,0.8);

    transition: all 0.2s ease;
}

button::before{
    content:'';
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background: radial-gradient(circle, rgba(255,0,0,0.3), transparent 70%);
    opacity:0;
    transition: opacity 0.3s;
}

button:hover{
    transform: translateY(-2px) scale(1.03);
    box-shadow:
        0 0 20px rgba(255,0,0,0.7),
        0 0 40px rgba(255,0,0,0.3),
        inset 0 0 15px rgba(0,0,0,0.9);
}

button:hover::before{
    opacity:1;
}

button:active{
    transform: scale(0.97);
    box-shadow:
        0 0 5px rgba(255,0,0,0.5),
        inset 0 0 20px rgba(0,0,0,1);
}

/* RIPPLE */
.ripple{
    position:absolute;
    width:10px;
    height:10px;
    background: rgba(255,255,255,0.6);
    border-radius:50%;
    transform: scale(0);
    animation: rippleEffect 0.6s linear;
    pointer-events:none;
}

@keyframes rippleEffect{
    to{
        transform: scale(15);
        opacity:0;
    }
}

.footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    color:var(--principal);
}

.status-box{
    margin-bottom:12px;
}

.status-buttons{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:5px;
}

.status-buttons button{
    padding:6px;
    border-radius:10px;
    font-size:12px;
}

/* BARRAS */
.bar-container{
    position:relative;
    width:100%;
    height:22px;
    background:#1a1a1a;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:5px;
    box-shadow: inset 0 0 6px #000;
}

.bar-fill{
    height:100%;
    width:100%;
    transition: width 0.3s ease;
}

/* CORES */
.bar-fill.pv{
    background: linear-gradient(90deg, #ff1a1a, #ff4d4d);
}

.bar-fill.pe{
    background: linear-gradient(90deg, #1a75ff, #4da6ff);
}

.bar-fill.san{
    background: linear-gradient(90deg, #9933ff, #cc66ff);
}

.bar-text{
    position:absolute;
    width:100%;
    text-align:center;
    top:0;
    left:0;
    font-size:13px;
    font-weight:bold;
    line-height:22px;
    color:white;
    text-shadow:0 0 4px black;
}
.estado{
    margin-left:8px;
    font-size:12px;
    font-weight:bold;
    padding:2px 6px;
    border-radius:8px;
}

/* cores por estado */
.estado.estavel{
    background:#2ecc71;
    color:#000;
}

.estado.ferido{
    background:#f1c40f;
    color:#000;
}

.estado.grave{
    background:#e67e22;
    color:#000;
}

.estado.morrendo{
    background:#e74c3c;
    color:#fff;
}
</style>
</head>

<body>

<header></header>

<div class="container">

<div class="card">
<h2>Informações</h2>
<label>Nome</label><input id="nome">
<label>Origem</label><input id="origem">
<label>Classe</label><input id="classe">
</div>

<div class="card">
<h2>Status</h2>

<label>Afinidade</label><input id="afi">

<div class="status-box">
  <label>PV <span id="pv-estado" class="estado"></span></label>
  <div class="bar-container">
    <div id="pv-bar" class="bar-fill pv"></div>
    <span id="pv-text" class="bar-text">100</span>
  </div>
  <input id="pv" type="number" value="100" hidden>

  <div class="status-buttons">
    <button onclick="alterar('pv', -5)">-5</button>
    <button onclick="alterar('pv', -1)">-1</button>
    <button onclick="alterar('pv', 1)">+1</button>
    <button onclick="alterar('pv', 5)">+5</button>
  </div>
</div>

<div class="status-box">
  <label>PE <span id="pe-estado" class="estado"></span></label>
  <div class="bar-container">
    <div id="pe-bar" class="bar-fill pe"></div>
    <span id="pe-text" class="bar-text">50</span>
  </div>
  <input id="pe" type="number" value="50" hidden>

  <div class="status-buttons">
    <button onclick="alterar('pe', -5)">-5</button>
    <button onclick="alterar('pe', -1)">-1</button>
    <button onclick="alterar('pe', 1)">+1</button>
    <button onclick="alterar('pe', 5)">+5</button>
  </div>
</div>

<div class="status-box">
  <label>Sanidade <span id="san-estado" class="estado"></span></label>
  <div class="bar-container">
    <div id="san-bar" class="bar-fill san"></div>
    <span id="san-text" class="bar-text">100</span>
  </div>
  <input id="san" type="number" value="100" hidden>

  <div class="status-buttons">
    <button onclick="alterar('san', -5)">-5</button>
    <button onclick="alterar('san', -1)">-1</button>
    <button onclick="alterar('san', 1)">+1</button>
    <button onclick="alterar('san', 5)">+5</button>
  </div>
</div>

<label>Defesa</label><input id="def">
<label>Movimento</label><input id="mov">

</div>

<div class="card">
<h2>Atributos</h2>
<div class="grid-attrs">
<div class="attr-box"><label>FOR</label><input id="for"></div>
<div class="attr-box"><label>DEX</label><input id="dex"></div>
<div class="attr-box"><label>CON</label><input id="con"></div>
<div class="attr-box"><label>INT</label><input id="int"></div>
<div class="attr-box"><label>CAR</label><input id="car"></div>
</div>
</div>

<div class="card">
<h2>Perícias</h2>
<div class="skills">
<label>Arcanismo</label><input id="arcanismo">
<label>Artes</label><input id="artes">
<label>Atletismo</label><input id="atletismo">
<label>Ciência</label><input id="ciencia">
<label>Crimes</label><input id="crimes">
<label>Diplomacia</label><input id="diplomacia">
<label>Enganação</label><input id="enganacao">
<label>Fortitude</label><input id="fortitude">
<label>Furtividade</label><input id="furtividade">
<label>História</label><input id="historia">
<label>Iniciativa</label><input id="iniciativa">
<label>Intimidação</label><input id="intimidacao">
<label>Intuição</label><input id="intuicao">
<label>Investigação</label><input id="investigacao">
<label>Luta</label><input id="luta">
<label>Medicina</label><input id="medicina">
<label>Percepção</label><input id="percepcao">
<label>Pilotagem</label><input id="pilotagem">
<label>Planejamento</label><input id="planejamento">
<label>Pontaria</label><input id="pontaria">
<label>Reflexos</label><input id="reflexos">
<label>Religião</label><input id="religiao">
<label>Sobrevivência</label><input id="sobrevivencia">
<label>Tecnologia</label><input id="tecnologia">
<label>Vontade</label><input id="vontade">
</div>
</div>

<div class="card">
<h2>Equipamentos</h2>
<textarea id="equipamentos" rows="6"></textarea>
</div>

<div class="card">
<h2>Habilidades</h2>
<textarea id="habilidades" rows="6"></textarea>
</div>

<div class="card">
<h2>Anotacoes</h2>
<textarea id="Anotacoes" rows="6"></textarea>
</div>

<div class="card">
<h2>Ações</h2>
<button onclick="salvar()">Salvar</button>
<button onclick="carregar()">Carregar</button>
<button onclick="limpar()">Limpar</button>
</div>

</div>

<div class="footer">V1 da ficha por Gleibson e Vini</div>

<script>
const campos = document.querySelectorAll('input, textarea');

function salvar(){
    const dados = {};
    campos.forEach(c => dados[c.id] = c.value);
    localStorage.setItem("ficha", JSON.stringify(dados));
}

function carregar(){
    const dados = JSON.parse(localStorage.getItem("ficha") || "{}");
    campos.forEach(c => c.value = dados[c.id] || '');

    atualizarBarra('pv');
    atualizarBarra('pe');
    atualizarBarra('san');
}

function limpar(){
    campos.forEach(c => c.value = '');

    document.getElementById("pv").value = 100;
    document.getElementById("pe").value = 50;
    document.getElementById("san").value = 100;

    localStorage.removeItem("ficha");

    atualizarBarra('pv');
    atualizarBarra('pe');
    atualizarBarra('san');
}
function alterar(id, valor){
    const input = document.getElementById(id);

    let atual = parseInt(input.value) || 0;
    atual += valor;

    if(atual < 0) atual = 0;
    if(atual > 100) atual = 100;

    input.value = atual;

    atualizarBarra(id);
}

function textoMaluco(texto){
    const chars = "!@#$%¨&*()_+=-?<>/[]{}ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    return texto.split("").map(l => {
        if(Math.random() < 0.3){
            return chars[Math.floor(Math.random() * chars.length)];
        }
        return l;
    }).join("");
}

let intervaloInsano = null;

function atualizarBarra(id){
    const valor = parseInt(document.getElementById(id).value) || 0;

    const barra = document.getElementById(id + "-bar");
    const texto = document.getElementById(id + "-text");

    const max = 100;

    let porcentagem = (valor / max) * 100;
    if(porcentagem > 100) porcentagem = 100;

    barra.style.width = porcentagem + "%";
    texto.innerText = valor;

    // brilho crítico
    if(porcentagem <= 25){
        barra.style.filter = "brightness(1.6)";
    } else {
        barra.style.filter = "none";
    }

    const estadoEl = document.getElementById(id + "-estado");
    if(!estadoEl) return;

    let estado = "";
    let classe = "";

    // === PV ===
    if(id === "pv"){
        if(porcentagem > 50){
            estado = "Estável";
            classe = "estavel";
        }
        else if(porcentagem > 15){
            estado = "Ferido";
            classe = "ferido";
        }
        else if(porcentagem > 0){
            estado = "Gravemente Ferido";
            classe = "grave";
        }
        else{
            estado = "Incapacitado";
            classe = "morrendo";
        }
    }

    // === PE ===
    if(id === "pe"){
        if(porcentagem > 50){
            estado = "Disposto";
            classe = "estavel";
        }
        else if(porcentagem > 15){
            estado = "Cansado";
            classe = "ferido";
        }
        else if(porcentagem > 0){
            estado = "Exausto";
            classe = "grave";
        }
        else{
            estado = "Incapacitado";
            classe = "morrendo";
        }
    }

    // === SANIDADE ===
function iniciarLoopInsano(estadoEL) {
    if (intervaloInsano) return;

    intervaloInsano = setInterval(() => {
        estadoEl.innerText = textoMaluco("INSANO");
    }, 120);
}

function pararLoopInsano(estadoEL) {
    if (!intervaloInsano) return;

    clearInterval(intervaloInsano);
    intervaloInsano = null;
}
    if (id === "san") {

    if (porcentagem > 50) {
        estado = "Estável";
        classe = "estavel";
        pararLoopInsano(estadoEl);
    }

    else if (porcentagem > 15) {
        estado = "Louco";
        classe = "ferido";
        pararLoopInsano();
    }

    else if (porcentagem > 0) {
        estado = "INSANO";
        classe = "grave";
        iniciarLoopInsano();
    }

    else {
        estado = "Colapso";
        classe = "morrendo";
        pararLoopInsano();
    }
}

if (!(id === "san" && porcentagem > 0 && porcentagem <= 15)) {
    estadoEl.innerText = estado;
}

estadoEl.className = `estado ${classe}`;
}
/* RIPPLE */
document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", function(e){
        const ripple = document.createElement("span");
        ripple.classList.add("ripple");

        const rect = btn.getBoundingClientRect();
        ripple.style.left = (e.clientX - rect.left) + "px";
        ripple.style.top = (e.clientY - rect.top) + "px";

        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    });
});

/* INICIALIZAÇÃO */
window.onload = function(){
    carregar();
};
</script>

</body>
</html>
